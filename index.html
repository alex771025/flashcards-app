<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Учебна карта</title>
  </head>
  <body>
    <main class="flashcards">
      <h2 id="questionText"></h2>
      <label for = "userAnswer">Твоят отговор:</label>
      <textarea id = "userAnswer" rows="4" placeholder="Напиши какво си спомняш..."></textarea>
      <button id="answerBtn">Покажи отговора</button>
      <button id="nextCardBtn">Следваща карта</button>
      <button id="restartBtn">Започни отначало</button>
      <button id = "previousBtn">Предишна карта</button>
      <p id="answerText"></p>
      <p id="cardCounter"></p>
    </main>
    <script src="index.js"></script>
  </body>
</html>
